<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e1b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>XENO Mobile</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#e9f0ff}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid #233047}h1{font-size:20px;letter-spacing:.22em;margin:0;color:#8adfff}small{color:#8194b0}.shell{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px 18px 130px}.bubble{max-width:86%;padding:13px 16px;border-radius:17px;margin:14px 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:#172237;border:1px solid #283852}.bubble.user{margin-left:auto;background:#16364b;border-color:#1c6077}.dock{position:fixed;bottom:0;left:0;right:0;background:#0c1423;border-top:1px solid #233047;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))}.dock-inner{max-width:750px;margin:auto;display:flex;gap:8px}input{flex:1;min-width:0;background:#172237;border:1px solid #31425a;border-radius:12px;padding:14px;color:white;font-size:16px}button{background:#19a7c9;border:0;color:#04121a;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1b2a40;color:#d9ebff}#settings{display:none;padding:20px;background:#111d2e;border-bottom:1px solid #25384e}#settings.open{display:block}#settings p{color:#a7b7cb;line-height:1.5}#settings button{margin-right:8px}.tag{font-size:12px;color:#5fd0ab}</style></head><body><div class="shell"><header><div><h1>XENO</h1><small>MOBILE / v0.3 <span class="tag" id="status">● CONNECTING</span></small></div><button class="secondary" id="settingsButton" aria-label="Settings">⚙ Settings</button></header><section id="settings"><strong>Settings</strong><p>XENO uses your private Cloudflare Access session. Groq credentials remain on the server. Conversations are saved locally on this device, not synchronized with the older GitHub Pages installation.</p><button id="clearButton" class="secondary">Clear conversation</button><button id="closeButton" class="secondary">Close</button></section><main class="messages" id="messages" aria-live="polite"></main></div><form class="dock" id="form"><div class="dock-inner"><input id="prompt" aria-label="Message" placeholder="Message XENO…" autocomplete="off" required maxlength="4000"><button type="submit">Send</button></div></form><script>
const key='xeno-mobile-chat-v1';const area=document.getElementById('messages'),input=document.getElementById('prompt'),form=document.getElementById('form'),status=document.getElementById('status');
let history=[];try{history=JSON.parse(localStorage.getItem(key))||[]}catch{}if(!Array.isArray(history))history=[];
function render(){area.replaceChildren();if(!history.length){const p=document.createElement('div');p.className='bubble';p.textContent='XENO ready. Send a message to begin.';area.append(p)}for(const m of history){const p=document.createElement('div');p.className='bubble '+(m.role==='user'?'user':'');p.textContent=m.text;area.append(p)}window.scrollTo(0,document.body.scrollHeight)}
function save(){localStorage.setItem(key,JSON.stringify(history.slice(-100)))}
async function checkHealth(){try{const r=await fetch('/health',{cache:'no-store'});if(!r.ok)throw Error('not ready');const d=await r.json();status.textContent=d.status==='online'?'● AI ONLINE':'● UNAVAILABLE'}catch{status.textContent='● LOGIN / CONNECTION REQUIRED'}}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;history.push({role:'user',text:message});save();input.value='';render();const button=form.querySelector('button');button.disabled=true;button.textContent='Thinking…';try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({provider:'groq',messages:history.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).map(m=>({role:m.role,content:m.text}))})});const data=await response.json();if(!response.ok)throw Error(data.error||'Gateway error');history.push({role:'assistant',text:data.reply||'No response received.'});save()}catch(err){history.push({role:'assistant',text:'Connection error: '+err.message+' (Your message is saved. Sign in through Safari if needed, then try again.)'});save()}finally{button.disabled=false;button.textContent='Send';render();checkHealth()}});
document.getElementById('settingsButton').onclick=()=>document.getElementById('settings').classList.toggle('open');document.getElementById('closeButton').onclick=()=>document.getElementById('settings').classList.remove('open');document.getElementById('clearButton').onclick=()=>{if(confirm('Delete locally saved messages?')){history=[];localStorage.removeItem(key);render()}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();checkHealth();
</script></body></html>
