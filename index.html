<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e1b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>XENO Mobile</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#e9f0ff}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid #233047}h1{font-size:20px;letter-spacing:.22em;margin:0;color:#8adfff}small{color:#8194b0}.shell{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px 18px 130px}.bubble{max-width:86%;padding:13px 16px;border-radius:17px;margin:14px 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:#172237;border:1px solid #283852}.bubble.user{margin-left:auto;background:#16364b;border-color:#1c6077}.dock{position:fixed;bottom:0;left:0;right:0;background:#0c1423;border-top:1px solid #233047;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))}.dock-inner{max-width:750px;margin:auto;display:flex;gap:8px}input{flex:1;min-width:0;background:#172237;border:1px solid #31425a;border-radius:12px;padding:14px;color:white;font-size:16px}button{background:#19a7c9;border:0;color:#04121a;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1b2a40;color:#d9ebff}#settings{display:none;padding:20px;background:#111d2e;border-bottom:1px solid #25384e}#settings.open{display:block}#settings p{color:#a7b7cb;line-height:1.5}#settings button{margin-right:8px}.tag{font-size:12px;color:#5fd0ab}</style></head><body><div class="shell"><header><div><h1>XENO</h1><small>MOBILE / v0.1 <span class="tag">● LOCAL MODE</span></small></div><button class="secondary" id="settingsButton" aria-label="Settings">⚙ Settings</button></header><section id="settings"><strong>Settings</strong><p>This is a local prototype. Messages stay in this browser's storage. There is no AI connection or cloud backup yet.</p><button id="clearButton" class="secondary">Clear conversation</button><button id="closeButton" class="secondary">Close</button></section><main class="messages" id="messages" aria-live="polite"></main></div><form class="dock" id="form"><div class="dock-inner"><input id="prompt" aria-label="Message" placeholder="Message XENO…" autocomplete="off" required maxlength="4000"><button type="submit">Send</button></div></form><script>const key='xeno-mobile-chat-v1';const area=document.getElementById('messages');const input=document.getElementById('prompt');let history;try{history=JSON.parse(localStorage.getItem(key))||[]}catch{history=[]}if(!Array.isArray(history))history=[];function render(){area.replaceChildren();if(!history.length){const p=document.createElement('div');p.className='bubble';p.textContent='XENO initialized. This is your mobile interface prototype. AI integration is coming in the next phase.';area.append(p)}for(const m of history){const p=document.createElement('div');p.className='bubble '+(m.role==='user'?'user':'');p.textContent=m.text;area.append(p)}window.scrollTo(0,document.body.scrollHeight)}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;history.push({role:'user',text},{role:'system',text:'Message saved locally. AI responses are not connected yet.'});localStorage.setItem(key,JSON.stringify(history));input.value='';render()});document.getElementById('settingsButton').onclick=()=>document.getElementById('settings').classList.toggle('open');document.getElementById('closeButton').onclick=()=>document.getElementById('settings').classList.remove('open');document.getElementById('clearButton').onclick=()=>{if(confirm('Delete locally saved messages?')){history=[];localStorage.removeItem(key);render()}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();</script></body></html>
